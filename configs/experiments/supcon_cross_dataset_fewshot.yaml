args:
  datasets:
    - pavia_university
    - salinas
  data_root: data
  shots: [5, 10]
  seeds: [0, 1, 2, 3, 4]
  encoder_checkpoint_dir: result/hybridsn_small_fewshot_pavia_salinas_5_10shot/checkpoints
  encoder_checkpoint_dirs:
    - result/hybridsn_small_fewshot_3datasets/checkpoints
  split_dir: result/hybridsn_small_fewshot_pavia_salinas_5_10shot/split_indices
  split_dirs:
    - result/hybridsn_small_fewshot_3datasets/split_indices
  output_dir: result/supcon_cross_dataset_pavia_salinas
  feature_cache_dirs:
    - result/hybridsn_small_spectral_qnn_gated_proto_pavia_salinas_5_10shot
    - result/hybridsn_small_spectral_qnn_gated_proto_pavia_seed4_5shot
    - result/hybridsn_small_spectral_qnn_gated_proto_pavia_10shot_seed0_2
    - result/hybridsn_small_spectral_qnn_gated_proto_pavia_10shot_seed3
    - result/hybridsn_small_spectral_qnn_gated_proto_pavia_10shot_seed4
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_partial
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_seed1_2_5shot
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_seed3_4_5shot
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_10shot_partial
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_10shot_seed1_2
    - result/hybridsn_small_spectral_qnn_gated_proto_salinas_10shot_seed3_4
  patch_size: 19
  pca_bands: 30
  conv3d_channels: [8, 16, 16]
  conv2d_channels: 32
  hidden_dim: 64
  dropout: 0.4
  batch_size: 16
  test_batch_size: 128
  feature_batch_size: 128
  epochs: 60
  patience: 10
  lr: 0.003
  weight_decay: 0.0001
  metric_weight: 0.2
  temperature: 0.2
  gate_mode: classwise
  spectral_branch_type: qnn
  mlp_hidden_dim: 6
  mlp_output_dim: 6
  fourier_dim: 6
  fourier_scale: 1.0
  qnn_variant: standard
  residual_scale_mode: none
  residual_alpha_init: -4.0
  residual_warmup_epochs: 0
  base_logit_mode: learned_head
  gate_context_mode: none
  gate_confidence_penalty: 0.0
  high_confidence_guard_mode: none
  guard_floor: 0.05
  guard_tau: 0.35
  guard_temperature: 0.08
  qubits: 6
  qnn_layers: 1
  entanglement: linear
  backend: lightning.qubit
  diff_method: adjoint
  angle_scale: 3.141592653589793
  monitor: macro_f1
  device: auto
  seed: 42
  preprocess_scope: full_image
  baseline_runs_files: []
  rebuild_features: false
  resume: false
